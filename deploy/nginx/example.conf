# Example: serve MVX Nexus over HTTPS behind your own nginx.
# Replace nexus.example.com and the certificate paths (e.g. from certbot / Let's Encrypt), then set
#   HOLMES_DASHBOARD_URL=https://nexus.example.com
#   HOLMES_CORS_ORIGINS=https://nexus.example.com
# in .env and run `docker compose up -d`.
server {
    listen 80;
    server_name nexus.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nexus.example.com;

    ssl_certificate     /etc/letsencrypt/live/nexus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.example.com/privkey.pem;

    client_max_body_size 5m;

    location / {
        # The frontend container (NEXUS_PORT in .env, 8080 by default).
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MCP chat answers stream for minutes; the app sends a keep-alive every 15 s and asks
        # nginx not to buffer (X-Accel-Buffering: no).
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
